<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bus Tickets | Conductor</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><strong>🚌 BUS TICKETS</strong><span>Conductor portal</span></div><button id="logoutBtn" class="secondary hidden">Log out</button></header>
<main><section id="loginView" class="panel login"><h1>Conductor sign in</h1><p>Record tickets and cash collected.</p><form id="loginForm"><label>Username<input id="username" value="conductor" required></label><label>Password<input id="password" type="password" value="bus123" required></label><button>Sign in</button><p id="loginMessage" class="message"></p></form><small>Demo: conductor / bus123</small></section>
<section id="appView" class="hidden"><div class="welcome"><div><h1>Issue a ticket</h1><p id="welcomeName"></p></div><div class="pill">Cash collected physically</div></div>
<div class="panel"><form id="ticketForm" class="ticket-form"><label>Route<select id="routeSelect" required></select></label><label>Bus<select id="busSelect"></select></label><label>Passenger name (optional)<input id="passenger" placeholder="Passenger"></label><button>Generate ticket</button></form><div id="ticketMessage" class="message"></div><div id="newTicket" class="ticket hidden"></div></div>
<div class="panel"><div class="section-title"><h2>My tickets</h2><button id="refreshBtn" class="secondary">Refresh</button></div><div id="ticketList"></div></div></section></main><script src="script.js"></script></body></html>
